services:
  postgres:
    image: postgres:18-alpine
    container_name: dealscanner_postgres
    environment:
      POSTGRES_DB: dealscanner
      POSTGRES_USER: dealscanner
      POSTGRES_PASSWORD: dealscanner
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealscanner -d dealscanner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
