spring.application.name=deal-scanner-backend
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
serpapi.api-key=${SERPAPI_API_KEY:}
spring.datasource.url=jdbc:postgresql://localhost:5433/dealscanner
spring.datasource.username=dealscanner
spring.datasource.password=dealscanner
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
management.endpoint.health.show-details=never
